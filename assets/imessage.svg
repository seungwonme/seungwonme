<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="554" viewBox="0 0 640 554" role="img" aria-labelledby="title desc">
  <title id="title">Aiden's GitHub profile conversation</title>
  <desc id="desc">A compact iMessage-style introduction and repositories pinned by seungwonme.</desc>
  <defs>
    <linearGradient id="imessage-blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="554">
      <stop offset="0" stop-color="#2597ff"/>
      <stop offset="1" stop-color="#0091ff"/>
    </linearGradient>
  </defs>
  <style>
    .canvas { fill: #1e1e1e; }
    .incoming-fill { fill: #3b3b3d; }
    .outgoing-fill { fill: url(#imessage-blue); }
    .message-text { fill: #ffffff; font: 400 24px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; letter-spacing: -.3px; }
    .message-secondary { fill: #e1e1e1; font: 400 24px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .repo-title { fill: #ffffff; font: 650 21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; letter-spacing: -.2px; }
    .repo-description { fill: #ffffff; font: 400 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .repo-meta { fill: #d7edff; font: 600 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .receipt { fill: #9a9a9a; font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .typing { opacity: 0; }
    .typing-dot { fill: #9a9a9a; }
    .message { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) and (update: fast) {
      .typing { transform-box: fill-box; transform-origin: left bottom; animation: typing-in 1s ease both; }
      .message { transform-box: fill-box; animation: message-in .26s cubic-bezier(.2,.8,.2,1) backwards; }
      .message.incoming { transform-origin: left bottom; }
      .message.outgoing { transform-origin: right bottom; }
      @keyframes typing-in { 0%, 100% { opacity: 0; transform: translateY(2px) scale(.97); } 15%, 85% { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes message-in { from { opacity: 0; transform: translateY(4px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    }
  </style>
  <rect width="640" height="554" class="canvas"/>
  <g class="message outgoing" style="animation-delay:.12s">
    <path d="M 604 48 L 607 60 C 612 66, 620 69, 629 70 C 620 66, 616 60, 614 51 Z" class="outgoing-fill"/>
    <rect x="374" y="16" width="250" height="48" rx="24" class="outgoing-fill"/>
    <text x="394" y="48" class="message-text"><tspan x="394" dy="0">Hey, I’m Aiden 👋</tspan></text>
  </g>
  <g class="typing incoming" style="animation-delay:.38s">
    <path d="M 36 104 L 33 116 C 28 122, 20 125, 11 126 C 20 122, 24 116, 26 107 Z" class="incoming-fill"/>
    <rect x="16" y="78" width="62" height="42" rx="21" class="incoming-fill"/>
    <circle cx="36" cy="99" r="4" class="typing-dot">
      <animate attributeName="opacity" values=".35;1;.35" dur=".75s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="47" cy="99" r="4" class="typing-dot">
      <animate attributeName="opacity" values=".35;1;.35" dur=".75s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="99" r="4" class="typing-dot">
      <animate attributeName="opacity" values=".35;1;.35" dur=".75s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g class="message incoming" style="animation-delay:1.38s">
    <path d="M 36 110 L 33 122 C 28 128, 20 131, 11 132 C 20 128, 24 122, 26 113 Z" class="incoming-fill"/>
    <rect x="16" y="78" width="240" height="48" rx="24" class="incoming-fill"/>
    <text x="36" y="110" class="message-text"><tspan x="36" dy="0">What do you do?</tspan></text>
  </g>
  <g class="message outgoing" style="animation-delay:1.76s">
    <path d="M 604 172 L 607 184 C 612 190, 620 193, 629 194 C 620 190, 616 184, 614 175 Z" class="outgoing-fill"/>
    <rect x="244" y="140" width="380" height="48" rx="24" class="outgoing-fill"/>
    <text x="264" y="172" class="message-text"><tspan x="264" dy="0">I focus on working AI-native.</tspan></text>
  </g>
  <g class="typing incoming" style="animation-delay:2.02s">
    <path d="M 36 228 L 33 240 C 28 246, 20 249, 11 250 C 20 246, 24 240, 26 231 Z" class="incoming-fill"/>
    <rect x="16" y="202" width="62" height="42" rx="21" class="incoming-fill"/>
    <circle cx="36" cy="223" r="4" class="typing-dot">
      <animate attributeName="opacity" values=".35;1;.35" dur=".75s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="47" cy="223" r="4" class="typing-dot">
      <animate attributeName="opacity" values=".35;1;.35" dur=".75s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="223" r="4" class="typing-dot">
      <animate attributeName="opacity" values=".35;1;.35" dur=".75s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g class="message incoming" style="animation-delay:3.02s">
    <path d="M 36 234 L 33 246 C 28 252, 20 255, 11 256 C 20 252, 24 246, 26 237 Z" class="incoming-fill"/>
    <rect x="16" y="202" width="360" height="48" rx="24" class="incoming-fill"/>
    <text x="36" y="234" class="message-text"><tspan x="36" dy="0">What are you building now?</tspan></text>
  </g>
  <g class="message outgoing" style="animation-delay:3.40s">
      <rect x="74" y="264" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="94" y="287" class="repo-title">seungwonme/skim</text>
      <text x="606" y="286" text-anchor="end" class="repo-meta">Python</text>
      <text x="94" y="311" class="repo-description"><tspan x="94" dy="0">Local-first information curation pipeline for feeds…</tspan></text>
    </g>
  <g class="message outgoing" style="animation-delay:3.62s">
      <rect x="74" y="330" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="94" y="353" class="repo-title">ai-native-engineer/linkedin-cli</text>
      <text x="606" y="352" text-anchor="end" class="repo-meta">Python · ★ 1</text>
      <text x="94" y="377" class="repo-description"><tspan x="94" dy="0">Terminal-first LinkedIn CLI: unofficial…</tspan></text>
    </g>
  <g class="message outgoing" style="animation-delay:3.84s">
      <rect x="74" y="396" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="94" y="419" class="repo-title">ai-native-engineer/astack</text>
      <text x="606" y="418" text-anchor="end" class="repo-meta">Python · ★ 1</text>
      <text x="94" y="443" class="repo-description"><tspan x="94" dy="0">Aiden&apos;s Stack — curated Claude Code skills…</tspan></text>
    </g>
  <g class="message outgoing" style="animation-delay:4.06s">
      <path d="M 604 506 L 607 518 C 612 524, 620 527, 629 528 C 620 524, 616 518, 614 509 Z" class="outgoing-fill"/>
      <rect x="74" y="462" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="94" y="485" class="repo-title">seungwonme/ai-podcast</text>
      <text x="606" y="484" text-anchor="end" class="repo-meta">Shell</text>
      <text x="94" y="509" class="repo-description"><tspan x="94" dy="0">AI 한 주 브리핑 — 비개발자용 AI 뉴스 팟캐스트 (AI 음성)</tspan></text>
    </g>
  <text x="620" y="542" text-anchor="end" class="receipt">Read: Tuesday</text>
</svg>
