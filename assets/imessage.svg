<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1048" viewBox="0 0 1000 1048" role="img" aria-labelledby="title desc">
  <title id="title">Aiden's live GitHub profile conversation</title>
  <desc id="desc">A dark iMessage-style conversation showing a Seoul forecast, today's date, and repositories pinned by seungwonme.</desc>
  <defs>
    <linearGradient id="imessage-blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1048">
      <stop offset="0" stop-color="#2597ff"/>
      <stop offset="1" stop-color="#0091ff"/>
    </linearGradient>
  </defs>
  <style>
    .canvas { fill: #1e1e1e; }
    .incoming-fill { fill: #3b3b3d; }
    .outgoing-fill { fill: url(#imessage-blue); }
    .message-text { fill: #ffffff; font: 400 27px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; letter-spacing: -.3px; }
    .message-secondary { fill: #e1e1e1; font: 400 27px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .repo-title { fill: #ffffff; font: 650 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; letter-spacing: -.2px; }
    .repo-description { fill: #ffffff; font: 400 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .repo-meta { fill: #d7edff; font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .receipt { fill: #9a9a9a; font: 600 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .message { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) and (update: fast) {
      .message { transform-box: fill-box; animation: message-in .26s cubic-bezier(.2,.8,.2,1) backwards; }
      .message.incoming { transform-origin: left bottom; }
      .message.outgoing { transform-origin: right bottom; }
      @keyframes message-in { from { opacity: 0; transform: translateY(4px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    }
  </style>
  <rect width="1000" height="1048" class="canvas"/>
  <g class="message incoming" style="animation-delay:.12s">
    <path d="M 28 66 L 25 78 C 20 84, 12 87, 3 88 C 12 84, 16 78, 18 69 Z" class="incoming-fill"/>
    <rect x="8" y="24" width="335" height="58" rx="31" class="incoming-fill"/>
    <text x="33" y="62" class="message-text"><tspan x="33" dy="0">Hey, I’m Aiden 👋</tspan></text>
  </g>
  <g class="message outgoing" style="animation-delay:.5s">
    <path d="M 972 180 L 975 192 C 980 198, 988 201, 997 202 C 988 198, 984 192, 982 183 Z" class="outgoing-fill"/>
    <rect x="292" y="108" width="700" height="88" rx="31" class="outgoing-fill"/>
    <text x="317" y="144" class="message-text"><tspan x="317" dy="0">I build AI-native systems that turn</tspan><tspan x="317" dy="34">information into useful work.</tspan></text>
  </g>
  <g class="message incoming" style="animation-delay:.88s">
    <path d="M 28 268 L 25 280 C 20 286, 12 289, 3 290 C 12 286, 16 280, 18 271 Z" class="incoming-fill"/>
    <rect x="8" y="226" width="370" height="58" rx="31" class="incoming-fill"/>
    <text x="33" y="264" class="message-text"><tspan x="33" dy="0">How’s Seoul today?</tspan></text>
  </g>
  <g class="message outgoing" style="animation-delay:1.26s">
    <path d="M 972 410 L 975 422 C 980 428, 988 431, 997 432 C 988 428, 984 422, 982 413 Z" class="outgoing-fill"/>
    <rect x="322" y="310" width="670" height="116" rx="31" class="outgoing-fill"/>
    <text x="347" y="343" class="message-text"><tspan x="347" dy="0">☁ 28°C · cloudy</tspan><tspan x="347" dy="34">Humidity 73% · Wind 2 m/s</tspan><tspan x="347" dy="34">Thursday, July 16</tspan></text>
  </g>
  <g class="message incoming" style="animation-delay:1.64s">
    <path d="M 28 498 L 25 510 C 20 516, 12 519, 3 520 C 12 516, 16 510, 18 501 Z" class="incoming-fill"/>
    <rect x="8" y="456" width="450" height="58" rx="31" class="incoming-fill"/>
    <text x="33" y="494" class="message-text"><tspan x="33" dy="0">What are you building now?</tspan></text>
  </g>
  <g class="message outgoing" style="animation-delay:1.90s">
      <rect x="252" y="540" width="740" height="112" rx="27" class="outgoing-fill"/>
      <text x="275" y="571" class="repo-title">seungwonme/skim</text>
      <text x="275" y="598" class="repo-description"><tspan x="275" dy="0">Local-first information curation pipeline for feeds,</tspan><tspan x="275" dy="23">social timelines, papers, videos, and AI lab updates.</tspan></text>
      <text x="970" y="639" text-anchor="end" class="repo-meta">Python</text>
    </g>
  <g class="message outgoing" style="animation-delay:2.12s">
      <rect x="252" y="660" width="740" height="112" rx="27" class="outgoing-fill"/>
      <text x="275" y="691" class="repo-title">ai-native-engineer/linkedin-cli</text>
      <text x="275" y="718" class="repo-description"><tspan x="275" dy="0">Terminal-first LinkedIn CLI: unofficial session-based</tspan><tspan x="275" dy="23">reads + official OAuth publishing, with packaged…</tspan></text>
      <text x="970" y="759" text-anchor="end" class="repo-meta">Python</text>
    </g>
  <g class="message outgoing" style="animation-delay:2.34s">
      <rect x="252" y="780" width="740" height="112" rx="27" class="outgoing-fill"/>
      <text x="275" y="811" class="repo-title">ai-native-engineer/astack</text>
      <text x="275" y="838" class="repo-description"><tspan x="275" dy="0">Aiden&apos;s Stack — curated Claude Code skills, installable as</tspan><tspan x="275" dy="23">a plugin.</tspan></text>
      <text x="970" y="879" text-anchor="end" class="repo-meta">Python · ★ 1</text>
    </g>
  <g class="message outgoing" style="animation-delay:2.56s">
      <path d="M 972 976 L 975 988 C 980 994, 988 997, 997 998 C 988 994, 984 988, 982 979 Z" class="outgoing-fill"/>
      <rect x="252" y="900" width="740" height="92" rx="27" class="outgoing-fill"/>
      <text x="275" y="931" class="repo-title">seungwonme/ai-podcast</text>
      <text x="275" y="958" class="repo-description"><tspan x="275" dy="0">AI 한 주 브리핑 — 비개발자용 AI 뉴스 팟캐스트 (AI 음성)</tspan></text>
      <text x="970" y="979" text-anchor="end" class="repo-meta">Shell</text>
    </g>
  <text x="970" y="1028" text-anchor="end" class="receipt">Read: Thursday</text>
</svg>
