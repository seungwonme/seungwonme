<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="554" viewBox="0 0 640 554" role="img" aria-labelledby="title desc">
  <title id="title">Aiden's GitHub profile conversation</title>
  <desc id="desc">A compact iMessage-style introduction and repositories pinned by seungwonme.</desc>
  <defs>
    <linearGradient id="imessage-blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="554">
      <stop offset="0" stop-color="#2597ff"/>
      <stop offset="1" stop-color="#0091ff"/>
    </linearGradient>
  </defs>
  <style>
    .canvas { fill: #1e1e1e; }
    .incoming-fill { fill: #3b3b3d; }
    .outgoing-fill { fill: url(#imessage-blue); }
    .message-text { fill: #ffffff; font: 400 24px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; letter-spacing: -.3px; }
    .message-secondary { fill: #e1e1e1; font: 400 24px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .repo-title { fill: #ffffff; font: 650 21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; letter-spacing: -.2px; }
    .repo-description { fill: #ffffff; font: 400 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .repo-meta { fill: #d7edff; font: 600 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .receipt { fill: #9a9a9a; font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .message { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) and (update: fast) {
      .message { transform-box: fill-box; animation: message-in .26s cubic-bezier(.2,.8,.2,1) backwards; }
      .message.incoming { transform-origin: left bottom; }
      .message.outgoing { transform-origin: right bottom; }
      @keyframes message-in { from { opacity: 0; transform: translateY(4px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    }
  </style>
  <rect width="640" height="554" class="canvas"/>
  <g class="message outgoing" style="animation-delay:.12s">
    <path d="M 612 48 L 615 60 C 620 66, 628 69, 637 70 C 628 66, 624 60, 622 51 Z" class="outgoing-fill"/>
    <rect x="412" y="16" width="220" height="48" rx="24" class="outgoing-fill"/>
    <text x="434" y="48" class="message-text"><tspan x="434" dy="0">Hey, I’m Aiden 👋</tspan></text>
  </g>
  <g class="message incoming" style="animation-delay:.5s">
    <path d="M 28 110 L 25 122 C 20 128, 12 131, 3 132 C 12 128, 16 122, 18 113 Z" class="incoming-fill"/>
    <rect x="8" y="78" width="200" height="48" rx="24" class="incoming-fill"/>
    <text x="30" y="110" class="message-text"><tspan x="30" dy="0">What do you do?</tspan></text>
  </g>
  <g class="message outgoing" style="animation-delay:.88s">
    <path d="M 612 172 L 615 184 C 620 190, 628 193, 637 194 C 628 190, 624 184, 622 175 Z" class="outgoing-fill"/>
    <rect x="302" y="140" width="330" height="48" rx="24" class="outgoing-fill"/>
    <text x="324" y="172" class="message-text"><tspan x="324" dy="0">I focus on working AI-native.</tspan></text>
  </g>
  <g class="message incoming" style="animation-delay:1.26s">
    <path d="M 28 234 L 25 246 C 20 252, 12 255, 3 256 C 12 252, 16 246, 18 237 Z" class="incoming-fill"/>
    <rect x="8" y="202" width="320" height="48" rx="24" class="incoming-fill"/>
    <text x="30" y="234" class="message-text"><tspan x="30" dy="0">What are you building now?</tspan></text>
  </g>
  <g class="message outgoing" style="animation-delay:1.90s">
      <rect x="82" y="264" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="102" y="287" class="repo-title">seungwonme/skim</text>
      <text x="614" y="286" text-anchor="end" class="repo-meta">Python</text>
      <text x="102" y="311" class="repo-description"><tspan x="102" dy="0">Local-first information curation pipeline for feeds…</tspan></text>
    </g>
  <g class="message outgoing" style="animation-delay:2.12s">
      <rect x="82" y="330" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="102" y="353" class="repo-title">ai-native-engineer/linkedin-cli</text>
      <text x="614" y="352" text-anchor="end" class="repo-meta">Python</text>
      <text x="102" y="377" class="repo-description"><tspan x="102" dy="0">Terminal-first LinkedIn CLI: unofficial…</tspan></text>
    </g>
  <g class="message outgoing" style="animation-delay:2.34s">
      <rect x="82" y="396" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="102" y="419" class="repo-title">ai-native-engineer/astack</text>
      <text x="614" y="418" text-anchor="end" class="repo-meta">Python · ★ 1</text>
      <text x="102" y="443" class="repo-description"><tspan x="102" dy="0">Aiden&apos;s Stack — curated Claude Code skills…</tspan></text>
    </g>
  <g class="message outgoing" style="animation-delay:2.56s">
      <path d="M 612 506 L 615 518 C 620 524, 628 527, 637 528 C 628 524, 624 518, 622 509 Z" class="outgoing-fill"/>
      <rect x="82" y="462" width="550" height="60" rx="22" class="outgoing-fill"/>
      <text x="102" y="485" class="repo-title">seungwonme/ai-podcast</text>
      <text x="614" y="484" text-anchor="end" class="repo-meta">Shell</text>
      <text x="102" y="509" class="repo-description"><tspan x="102" dy="0">AI 한 주 브리핑 — 비개발자용 AI 뉴스 팟캐스트 (AI 음성)</tspan></text>
    </g>
  <text x="620" y="542" text-anchor="end" class="receipt">Read: Friday</text>
</svg>
